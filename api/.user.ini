; Zwiększone limity PHP dla tego katalogu (działa z IIS FastCGI bez zmian globalnego php.ini).
; Odśwież po edycji może potrwać do user_ini.cache_ttl (domyślnie 300 s) albo zrestartuj pulę aplikacji IIS.
upload_max_filesize = 512M
post_max_size = 512M
memory_limit = 512M
max_execution_time = 300
max_input_time = 300
